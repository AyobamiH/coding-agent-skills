name: Plugin release acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test the extracted distribution
        run: node --test tests/plugin-package.test.mjs
      - name: Build the review ZIP
        run: node scripts/build-plugin.mjs
      - name: Keep the accepted package
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coding-agent-skills-plugin
          path: dist/coding-agent-skills-*-plugin.zip
          if-no-files-found: error
